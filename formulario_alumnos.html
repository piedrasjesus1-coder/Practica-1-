<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Alumno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="email"], input[type="tel"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulario de Alumno</h2>
    <form action="#" method="post">
        
        <!-- Pregunta 1: Nombre -->
        <div class="form-group">
            <label for="nombre">1. Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <!-- Pregunta 2: Género -->
        <div class="form-group">
            <label for="genero">2. Género:</label>
            <select id="genero" name="genero" required>
                <option value="">Selecciona una opción</option>
                <option value="femenino">Femenino</option>
                <option value="masculino">Masculino</option>
                <option value="otro">Otro</option>
                <option value="prefiero_no_decir">Prefiero no decir</option>
            </select>
        </div>

        <!-- Pregunta 3: Teléfono -->
        <div class="form-group">
            <label for="telefono">3. Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>

        <!-- Pregunta 4: Dirección -->
        <div class="form-group">
            <label for="direccion">4. Dirección:</label>
            <input type="text" id="direccion" name="direccion" required>
        </div>

        <!-- Pregunta 5: Correo -->
        <div class="form-group">
            <label for="correo">5. Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>
        </div>

        <button type="submit">Enviar</button>
    </form>
</div>

</body>
</html>
